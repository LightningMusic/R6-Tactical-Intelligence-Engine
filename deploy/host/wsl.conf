# /etc/wsl.conf for the R6Host distro.
#
# The distro is a sealed box: Windows drives (C:, D:, ...) are not mounted and
# Linux processes cannot launch Windows programs. Even root inside this distro
# can't see your files. Files go in through `r6ctl sync` / `r6ctl migrate`.
[boot]
systemd=true

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[network]
hostname=r6host
generateResolvConf=true

[user]
default=root
